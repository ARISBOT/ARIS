name: Automatic APK Scanner on Issue

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  scan-apk:
    # Trigger if URL, github link, or .apk is mentioned in issue or comment
    if: contains(github.event.issue.body, 'http') || contains(github.event.issue.body, '.apk') || (github.event.comment != null && (contains(github.event.comment.body, 'http') || contains(github.event.comment.body, '.apk')))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Debug Workflow Context
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::group::Debug Event Context"
          echo "Event Name: ${{ github.event_name }}"
          echo "Issue Number: ${{ github.event.issue.number }}"
          echo "Issue Title: ${{ github.event.issue.title }}"
          echo "::endgroup::"

      - name: Extract APK URL
        id: extract_url
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import re, os, urllib.request, json

          def extract_apk_url(text):
              if not text:
                  return None

              # 1. Look for direct .apk URLs
              apk_urls = re.findall(r'https?://[^\s\)]+?\.apk(?:\?[^\s\)]*)?', text, re.IGNORECASE)
              if apk_urls:
                  return apk_urls[0].rstrip(')]>\"\'.,;')

              # 2. Look for GitHub release URLs (e.g. /releases/tag/v1.0 or /releases#release-v1.0 or /releases/latest)
              release_match = re.search(r'https?://github\.com/([^/\s]+)/([^/\s#]+)/releases(?:/(?:tag/|download/)?([^/\s#]+)|#release-([^\s\)]+))?', text, re.IGNORECASE)
              if release_match:
                  owner, repo, tag1, tag2 = release_match.groups()
                  tag = tag1 or tag2
                  if tag and tag.lower() != 'latest':
                      api_url = f'https://api.github.com/repos/{owner}/{repo}/releases/tags/{tag}'
                  else:
                      api_url = f'https://api.github.com/repos/{owner}/{repo}/releases/latest'

                  try:
                      headers = {'User-Agent': 'Mozilla/5.0'}
                      token = os.environ.get('GH_TOKEN')
                      if token:
                          headers['Authorization'] = f'token {token}'
                      req = urllib.request.Request(api_url, headers=headers)
                      with urllib.request.urlopen(req) as resp:
                          data = json.loads(resp.read().decode())
                          for asset in data.get('assets', []):
                              asset_url = asset.get('browser_download_url', '')
                              if asset_url.lower().endswith('.apk') or '.apk' in asset_url.lower():
                                  return asset_url
                  except Exception as e:
                      print(f'GitHub API release fetch info: {e}')

              # 3. Look for GitHub file/asset attachment URLs
              asset_urls = re.findall(r'https?://github\.com/[^\s\)]+?/(?:files|assets|user-attachments/assets)/[^\s\)]+', text, re.IGNORECASE)
              if asset_urls:
                  return asset_urls[0].rstrip(')]>\"\'.,;')

              return None

          event_name = os.environ.get('EVENT_NAME', '')
          comment_body = os.environ.get('COMMENT_BODY', '')
          issue_body = os.environ.get('ISSUE_BODY', '')

          apk_url = None
          if event_name == 'issue_comment':
              apk_url = extract_apk_url(comment_body)
              if not apk_url:
                  apk_url = extract_apk_url(issue_body)
          else:
              apk_url = extract_apk_url(issue_body)

          output_file = os.environ['GITHUB_OUTPUT']
          if apk_url:
              print(f'Found APK URL: {apk_url}')
              with open(output_file, 'a') as f:
                  f.write(f'found=true\n')
                  f.write(f'apk_url={apk_url}\n')
          else:
              print('No valid APK URL found in issue/comment body.')
              with open(output_file, 'a') as f:
                  f.write(f'found=false\n')
          "

      - name: Download APK File
        if: steps.extract_url.outputs.found == 'true'
        env:
          APK_URL: ${{ steps.extract_url.outputs.apk_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading APK from: $APK_URL"
          curl -f -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -H "Authorization: Bearer $GH_TOKEN" -o target_app.apk "$APK_URL" || \
          curl -f -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o target_app.apk "$APK_URL"

          python3 -c "
          import zipfile, sys, os
          if not os.path.exists('target_app.apk') or os.path.getsize('target_app.apk') == 0:
              print('Downloaded file is empty or missing.')
              sys.exit(1)
          if not zipfile.is_zipfile('target_app.apk'):
              print('Downloaded file is not a valid zip/APK archive.')
              sys.exit(1)
          print('Successfully downloaded valid APK archive.')
          "

      - name: Scan APK with Katastima APK Scanner
        if: steps.extract_url.outputs.found == 'true'
        run: |
          mkdir -p scan_results
          GRADLE_ARGS=""
          if [ "${{ runner.debug }}" = "1" ]; then
            GRADLE_ARGS="--info --stacktrace"
          fi
          ./gradlew $GRADLE_ARGS :cli:run --args="scan-apk target_app.apk --store-json pretty --json pretty -o scan_results"

      - name: Debug Raw Scan Output
        if: ${{ runner.debug == '1' }}
        run: |
          echo "::group::Raw Scan JSON Output"
          cat scan_results/*.json || true
          echo "::endgroup::"

      - name: Generate Markdown Scan Report
        if: steps.extract_url.outputs.found == 'true'
        id: generate_report
        run: |
          python3 -c "
          import json, glob, os, sys

          json_files = glob.glob('scan_results/*.json')
          if not json_files:
              print('No scan result JSON found')
              sys.exit(1)

          with open(json_files[0], 'r') as f:
              data = json.load(f)

          sha256 = data.get('apkFileSha256', 'N/A')
          duration = data.get('scanDurationMs', 0)

          manifest_res = data.get('manifestCheckResult', {}) or {}
          manifest = manifest_res.get('manifest', {}) or {}

          app_label = manifest.get('label', '')
          app_id = manifest.get('appId', 'Unknown')
          version_name = manifest.get('versionName', 'N/A')
          version_code = manifest.get('versionCode', 'N/A')
          min_sdk = manifest.get('minSdk', 'N/A')
          target_sdk = manifest.get('targetSdk', 'N/A')

          dangerous_perms = manifest_res.get('dangerousPermissions', [])
          dangerous_flags = manifest_res.get('dangerousFlags', [])
          dangerous_filters = manifest_res.get('dangerousFilters', [])

          signing_res = data.get('signingCheckResult', {}) or {}
          apk_sig = signing_res.get('signingSchemas', {}) or signing_res.get('apkSigResult', {}) or {}
          verified = apk_sig.get('verifiedByApkSig', False)

          lib_res = data.get('libraryCheckResult', {}) or {}
          detected_libs = [f\"{lib.get('name', 'Unknown')} ({lib.get('type', 'lib')})\" for lib in lib_res.get('detectedLibraries', []) if lib.get('name')]
          offending_libs = [lib.get('name', '') for lib in lib_res.get('offendingLibraries', []) if lib.get('name')]
          anti_features = lib_res.get('antiFeatures', [])

          report = f'''## 🔍 Katastima APK Scan Results

          ### 📱 App Information
          - **App Name:** {app_label if app_label else 'N/A'}
          - **App ID (Package):** \`{app_id}\`
          - **Version:** {version_name} (Code: {version_code})
          - **Target SDK:** {target_sdk} | **Min SDK:** {min_sdk}
          - **File SHA-256:** \`{sha256}\`
          - **Scan Duration:** {duration} ms

          ---

          ### 🔒 Signature & Integrity
          - **Verified by ApkSig:** {'✅ Yes' if verified else '❌ No / Unverified'}
          - **V1 Scheme:** {'✅' if apk_sig.get('v1') else '❌'} | **V2 Scheme:** {'✅' if apk_sig.get('v2') else '❌'} | **V3 Scheme:** {'✅' if apk_sig.get('v3') else '❌'} | **V4 Scheme:** {'✅' if apk_sig.get('v4') else '❌'}

          ---

          ### ⚠️ Security & Risk Flags
          - **Dangerous Permissions ({len(dangerous_perms)}):** {', '.join([f'\`{p}\`' for p in dangerous_perms]) if dangerous_perms else 'None detected'}
          - **Dangerous Flags ({len(dangerous_flags)}):** {', '.join([f'\`{f}\`' for f in dangerous_flags]) if dangerous_flags else 'None detected'}
          - **Dangerous Intent Filters ({len(dangerous_filters)}):** {', '.join([f'\`{i}\`' for i in dangerous_filters]) if dangerous_filters else 'None detected'}

          ---

          ### 📦 Libraries & Anti-Features
          - **Offending Libraries ({len(offending_libs)}):** {', '.join([f'🚨 \`{o}\`' for o in offending_libs]) if offending_libs else 'None detected'}
          - **Detected Anti-Features:** {', '.join([f'⚠️ \`{a}\`' for a in anti_features]) if anti_features else 'None detected'}
          - **Detected Third-Party Libraries ({len(detected_libs)}):** {', '.join(detected_libs) if detected_libs else 'None detected'}

          ---
          *Automated scan generated by [Katastima APK Scanner](https://github.com/ankanrajghosh509-svg/apkscanner)*
          '''

          with open('comment_report.md', 'w') as f:
              f.write(report)
          "

      - name: Post Comment on Issue
        if: steps.extract_url.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file comment_report.md
